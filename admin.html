<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wander Stories — Admin</title><link rel="stylesheet" href="style.css"><style>
body{background:#ebe6dc}.admin{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.side{background:#171714;color:#fff;padding:30px 24px}.side h2{font:600 35px var(--serif);margin:0 0 35px}.side a{display:block;padding:13px 0;color:#aaa;font-size:10px;text-transform:uppercase;letter-spacing:.12em}.main{padding:45px 5vw}.main h1{font-size:62px}.login,.dash{max-width:1100px}.admin-card{background:#f8f4eb;padding:28px;margin-top:20px;border:1px solid #d8d1c5}.admin-card h3{font:600 30px var(--serif);margin:0 0 15px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}.fields label{font-size:9px;letter-spacing:.1em;text-transform:uppercase}.fields input,.fields textarea{width:100%;padding:12px;border:1px solid #ccc;background:#fff;margin-top:6px}.btn{border:0;background:#171714;color:#fff;padding:12px 16px;font-size:9px;text-transform:uppercase;letter-spacing:.12em;cursor:pointer}.trip{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ddd;padding:18px 0}.hidden{display:none}.note{font-size:11px;color:#777;line-height:1.6}@media(max-width:800px){.admin{grid-template-columns:1fr}.side{display:none}.fields{grid-template-columns:1fr}}
</style></head><body><div class="admin"><aside class="side"><h2>Wander<br>Stories</h2><a href="index.html">View website ↗</a><a href="#">Dashboard</a><a href="editor.html">Magazine Editor</a></aside><main class="main"><div id="login" class="login"><p class="eyebrow">PRIVATE CONSOLE</p><h1>Admin login</h1><div class="admin-card"><div class="fields"><label>Username<input id="au"></label><label>Password<input id="ap" type="password"></label></div><br><button class="btn" onclick="doLogin()">Enter dashboard</button><p class="note">Admin credentials are verified by Google Apps Script.</p></div></div><div id="dash" class="dash hidden"><p class="eyebrow">ADMIN CONSOLE</p><h1>Dashboard</h1><div class="admin-card"><h3>Journeys</h3><div id="trips"></div><br><button class="btn" onclick="location.href='editor.html'">Open magazine editor</button></div><div class="admin-card"><h3>Riders</h3><div id="riders"></div></div></div></main></div><script src="config.js"></script><script src="api.js"></script><script>
async function doLogin(){try{const d=await API.adminLogin(au.value,ap.value);sessionStorage.setItem("wsAdminToken",d.token);load()}catch(e){alert(e.message)}}
async function load(){const token=sessionStorage.getItem("wsAdminToken");if(!token)return;try{const d=await API.adminData(token);login.classList.add("hidden");dash.classList.remove("hidden");trips.innerHTML=d.trips.map(t=>`<div class="trip"><span><b>${t.number}</b><br>${t.title}</span><span>${t.km} KM</span><button class="btn" onclick="location.href='editor.html?trip=${t.id}'">EDIT</button></div>`).join("");riders.innerHTML=d.riders.map(r=>`<div class="trip"><span>${r.id} — ${r.name}</span><span>${r.active?"ACTIVE":"OFF"}</span></div>`).join("")}catch(e){sessionStorage.removeItem("wsAdminToken")}}
load();
</script></body></html>
