<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Magazine Editor</title><link rel="stylesheet" href="style.css"><style>
body{background:#ebe6dc}.wrap{max-width:1200px;margin:auto;padding:45px 5vw}.top{display:flex;justify-content:space-between;align-items:end}.top h1{font-size:60px}.box{background:#f9f5ec;border:1px solid #d8d1c5;padding:25px;margin-top:20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fields label{font-size:9px;text-transform:uppercase;letter-spacing:.12em}.fields input,.fields textarea,.fields select{width:100%;padding:12px;border:1px solid #ccc;background:#fff;margin-top:6px}.wide{grid-column:1/-1}.btn{border:0;background:#171714;color:#fff;padding:12px 16px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}.light{background:#fff;color:#171714;border:1px solid #bbb}.item{border-top:1px solid #ddd;padding:15px 0}.item-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item input,.item textarea{width:100%;padding:10px;border:1px solid #ccc}.remove{float:right;color:#a24e37;background:none;border:0}.note{font-size:11px;color:#777;line-height:1.6}@media(max-width:800px){.fields,.item-grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><main class="wrap"><div class="top"><div><p class="eyebrow">MAGAZINE BUILDER</p><h1>Editor</h1></div><div><button class="btn light" onclick="location.href='admin.html'">Dashboard</button> <button class="btn" onclick="save()">Save magazine</button></div></div>
<div class="box"><p class="eyebrow">TRIP</p><div class="fields"><label>Trip ID<input id="id" placeholder="ride-07"></label><label>Number<input id="number" placeholder="RIDE 07"></label><label>Title<input id="title"></label><label>Subtitle<input id="subtitle"></label><label>Date<input id="date"></label><label>KM<input id="km" type="number"></label><label>Riders<input id="riders" type="number"></label><label>Visibility<select id="visibility"><option>private</option><option>public</option></select></label><label class="wide">Cover image URL<input id="cover" placeholder="Google Drive/public image URL"></label></div></div>
<div class="box"><p class="eyebrow">CHAPTERS</p><div id="chapters"></div><button class="btn light" onclick="addChapter()">+ Chapter</button></div>
<div class="box"><p class="eyebrow">MEMORIES</p><div id="memories"></div><button class="btn light" onclick="addMemory()">+ Memory</button></div>
<div class="box"><p class="eyebrow">ROUTE</p><div id="route"></div><button class="btn light" onclick="addRoute()">+ Route point</button><p class="note">For production, the next enhancement can add a map picker so you click a location instead of entering latitude/longitude manually.</p></div>
</main><script src="config.js"></script><script src="api.js"></script><script>
let T={id:"",number:"",title:"",subtitle:"",date:"",km:0,riders:0,visibility:"private",cover:"",chapters:[],memories:[],route:[]};
const q=s=>document.querySelector(s),esc=s=>String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
function render(){q("#chapters").innerHTML=T.chapters.map((x,i)=>`<div class=item><button class=remove onclick="T.chapters.splice(${i},1);render()">Remove</button><div class=item-grid><input placeholder="Eyebrow" value="${esc(x.eyebrow)}" oninput="T.chapters[${i}].eyebrow=this.value"><input placeholder="Title" value="${esc(x.title)}" oninput="T.chapters[${i}].title=this.value"><textarea placeholder="Story" oninput="T.chapters[${i}].text=this.value">${esc(x.text)}</textarea></div></div>`).join("");
q("#memories").innerHTML=T.memories.map((x,i)=>`<div class=item><button class=remove onclick="T.memories.splice(${i},1);render()">Remove</button><div class=item-grid><input placeholder="Title" value="${esc(x.title)}" oninput="T.memories[${i}].title=this.value"><input placeholder="Image URL" value="${esc(x.imageUrl)}" oninput="T.memories[${i}].imageUrl=this.value"><textarea placeholder="Caption" oninput="T.memories[${i}].caption=this.value">${esc(x.caption)}</textarea><input placeholder="Rider ID" value="${esc(x.riderId)}" oninput="T.memories[${i}].riderId=this.value"></div></div>`).join("");
q("#route").innerHTML=T.route.map((x,i)=>`<div class=item><button class=remove onclick="T.route.splice(${i},1);render()">Remove</button><div class=item-grid><input placeholder="Location" value="${esc(x.name)}" oninput="T.route[${i}].name=this.value"><input placeholder="Time" value="${esc(x.time)}" oninput="T.route[${i}].time=this.value"><input placeholder="Latitude" value="${esc(x.lat)}" oninput="T.route[${i}].lat=this.value"><input placeholder="Longitude" value="${esc(x.lng)}" oninput="T.route[${i}].lng=this.value"><textarea placeholder="Memory/note" oninput="T.route[${i}].note=this.value">${esc(x.note)}</textarea></div></div>`).join("")}
function addChapter(){T.chapters.push({eyebrow:"CHAPTER",title:"New chapter",text:""});render()}function addMemory(){T.memories.push({title:"New memory",caption:"",imageUrl:"",riderId:""});render()}function addRoute(){T.route.push({name:"New stop",time:"",lat:"",lng:"",note:""});render()}
function fill(){["id","number","title","subtitle","date","km","riders","visibility","cover"].forEach(k=>q("#"+k).value=T[k]??"");render()}
async function save(){["id","number","title","subtitle","date","km","riders","visibility","cover"].forEach(k=>T[k]=q("#"+k).value);T.km=Number(T.km);T.riders=Number(T.riders);try{const r=await API.saveTrip(sessionStorage.getItem("wsAdminToken"),T);T=r;alert("Magazine saved to Google Sheets.")}catch(e){alert(e.message)}}
fill();
</script></body></html>
