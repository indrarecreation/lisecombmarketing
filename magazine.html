<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ride Magazine</title><link rel="stylesheet" href="style.css"><style>
.mag-top{padding:25px 6vw;display:flex;justify-content:space-between;font-size:9px;letter-spacing:.14em}.mag-cover{min-height:85vh;background:linear-gradient(0deg,#000b,transparent 70%),url("assets/images/ride-01.jpg") center/cover;display:flex;align-items:end;padding:8vw;color:#fff}.mag-cover h1{font-size:clamp(65px,10vw,145px)}.story{max-width:1100px;margin:auto;padding:110px 6vw}.story-head{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:end}.story h2,.route h2{font-size:80px}.story-copy{font:500 24px/1.55 var(--serif);color:#514d46}.memory-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:18px;margin-top:65px}.memory-grid img{width:100%;height:100%;min-height:300px;object-fit:cover}.memory-note{background:#e7dfd1;padding:45px;margin-top:55px;font:500 28px/1.35 var(--serif)}.route{background:#191916;color:#fff;padding:110px 7vw}.route-layout{display:grid;grid-template-columns:1fr 1fr;gap:60px;margin-top:55px}.route-map{min-height:510px;border:1px solid #fff2;position:relative;background:radial-gradient(circle,#34342c,#181815 65%);overflow:hidden}.route-line{position:absolute;left:15%;top:15%;width:70%;height:70%;border-left:2px dashed #bd7850;border-radius:50%;transform:rotate(13deg)}.pin{position:absolute;width:14px;height:14px;border:3px solid #fff;background:#bd7850;border-radius:50%;box-shadow:0 0 0 7px #bd785028}.pin span{position:absolute;left:22px;top:-4px;white-space:nowrap;font-size:9px;letter-spacing:.12em}.p1{left:15%;top:20%}.p2{left:45%;top:42%}.p3{left:70%;top:65%}.p4{left:42%;top:82%}.timeline{display:flex;flex-direction:column;gap:24px}.stop{display:grid;grid-template-columns:90px 1fr;gap:20px;border-bottom:1px solid #fff2;padding-bottom:20px}.stop small{color:#bd7850;letter-spacing:.15em}.stop h3{font:600 35px var(--serif);margin:0}.stop p{color:#aaa;font-size:12px;line-height:1.6}.stats{display:grid;grid-template-columns:repeat(4,1fr);padding:75px 7vw;gap:20px}.stat strong{font:600 45px var(--serif);display:block}.stat span{font-size:8px;letter-spacing:.16em;color:#777}@media(max-width:800px){.story-head,.route-layout,.memory-grid{grid-template-columns:1fr}.story h2,.route h2{font-size:58px}.stats{grid-template-columns:1fr 1fr}}
</style></head><body>
<div class="mag-top"><a href="index.html">← BACK TO ARCHIVE</a><span id="magTitle">PRIVATE MAGAZINE</span><span id="rider"></span></div>
<section class="mag-cover"><div><p class="eyebrow" id="meta">LOADING</p><h1 id="title">Journey</h1><p id="subtitle"></p></div></section>
<section class="story"><div class="story-head"><div><p class="eyebrow">THE STORY</p><h2 id="chapterTitle">The Beginning</h2></div><p class="story-copy" id="chapterText"></p></div><div class="memory-grid" id="memoryGrid"></div><div class="memory-note" id="memoryNote"></div></section>
<section class="route"><p class="eyebrow">THE ROAD</p><h2>Follow the<br><em>memory line.</em></h2><div class="route-layout"><div class="route-map"><div class="route-line"></div><div id="pins"></div></div><div class="timeline" id="timeline"></div></div></section>
<section class="stats"><div class="stat"><strong id="km">0</strong><span>KILOMETRES</span></div><div class="stat"><strong id="riders">0</strong><span>RIDERS</span></div><div class="stat"><strong id="stops">0</strong><span>STOPS</span></div><div class="stat"><strong id="photos">0</strong><span>PHOTOS</span></div></section>
<footer class="footer"><a href="index.html">← Return to all journeys</a><span>WANDER STORIES © 2026</span></footer>
<script src="config.js"></script><script src="api.js"></script><script>
(async()=>{try{const id=new URLSearchParams(location.search).get("trip");const token=sessionStorage.getItem("wsToken");const t=await API.trip(id,token);document.title=t.title+" — Wander Stories";magTitle.textContent=t.number+" / "+t.title;rider.textContent=sessionStorage.getItem("wsRider")?JSON.parse(sessionStorage.getItem("wsRider")).name:"";title.textContent=t.title;subtitle.textContent=t.subtitle;meta.textContent=`${t.date} · ${t.km} KM · ${t.riders} RIDERS`;document.querySelector(".mag-cover").style.backgroundImage=`linear-gradient(0deg,#000b,transparent 70%),url("${t.cover}")`;chapterTitle.textContent=t.chapters?.[0]?.title||"The Beginning";chapterText.textContent=t.chapters?.[0]?.text||"";km.textContent=t.km;riders.textContent=t.riders;stops.textContent=(t.route||[]).length;photos.textContent=(t.memories||[]).length;memoryGrid.innerHTML=(t.memories||[]).slice(0,2).map(m=>`<img src="${m.image}" alt="${m.title}">`).join("");memoryNote.textContent=t.memories?.[0]?.caption||"A moment worth keeping.";timeline.innerHTML=(t.route||[]).map(r=>`<div class="stop"><small>${r.time||""}</small><div><h3>${r.name}</h3><p>${r.note||""}</p></div></div>`).join("");const pins=(t.route||[]).slice(0,4);pins.forEach((p,i)=>{const el=document.createElement("div");el.className="pin p"+(i+1);el.innerHTML=`<span>${p.name}</span>`;document.querySelector("#pins").appendChild(el)})}catch(e){document.body.innerHTML="<div style='padding:50px;font-family:Arial'>Unable to load this magazine. Please login again or configure the Apps Script URL.</div>"}})();
</script></body></html>
